server.port=5000
spring.application.name=medscribe-gateway

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/MedScribeDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=MedScribe2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Respetar nombres exactos en @Table(name=...) y @Column(name=...).
# MySQL en Linux es case-sensitive; sin esto Hibernate pasa todo a snake_case lowercase.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT
medscribe.jwt.secret=clave-secreta-super-segura-medscribe-cambiar-en-produccion-minimo-256-bits
medscribe.jwt.expiracion=86400000

# External services
medscribe.servicio-ia.url=http://localhost:8000

# CORS
medscribe.cors.origenes-permitidos=http://localhost:4200,http://localhost:3000

# Logging
logging.level.org.springframework.security=INFO
logging.level.pe.medscribe=DEBUG
